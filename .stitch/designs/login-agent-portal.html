<body class="bg-background text-on-surface font-body-md h-screen w-screen overflow-hidden flex flex-col md:flex-row antialiased selection:bg-primary-container selection:text-white">
<!-- Left Brand Panel (55%) -->
<div class="hidden md:flex md:w-[55%] bg-[#F8FAFC] flex-col justify-center px-12 lg:px-24 border-r border-graphite-border">
<div class="max-w-md">
<!-- Product Wordmark -->
<h1 class="font-display-lg text-display-lg text-primary-container mb-4 font-bold tracking-tight">Agent 平台</h1>
<!-- Tagline -->
<p class="font-body-lg text-body-lg text-ink-text font-medium mb-12">企业智能助手 · 一个入口，问所有事</p>
<!-- Capabilities List -->
<ul class="space-y-4">
<li class="flex items-center text-on-surface-variant font-body-md">
<span class="w-2 h-2 rounded-full bg-[#14B8A6] mr-3"></span>
          IT 运维问答
        </li>
<li class="flex items-center text-on-surface-variant font-body-md">
<span class="w-2 h-2 rounded-full bg-[#14B8A6] mr-3"></span>
          报销政策查询
        </li>
<li class="flex items-center text-on-surface-variant font-body-md">
<span class="w-2 h-2 rounded-full bg-[#14B8A6] mr-3"></span>
          代码评审助手
        </li>
</ul>
</div>
</div>
<!-- Right Auth Area (45%) -->
<div class="w-full md:w-[45%] h-full bg-mist-surface flex items-center justify-center p-6 sm:p-12 relative">
<!-- Login Card Container -->
<div class="w-full max-w-[400px]">
<!-- Mobile Header (Hidden on Desktop) -->
<div class="md:hidden mb-8 text-center">
<h1 class="font-display-lg text-display-lg text-primary-container mb-2 font-bold tracking-tight">Agent 平台</h1>
<p class="font-body-md text-body-md text-ink-text font-medium">企业智能助手 · 一个入口，问所有事</p>
</div>
<!-- Title -->
<h2 class="font-display-lg text-display-lg text-on-surface mb-8">登录</h2>
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">企业邮箱</label>
<div class="relative">
<input class="w-full px-4 py-3 rounded-lg border border-graphite-border bg-mist-surface text-on-surface font-body-md focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/15 transition-all" id="email" name="email" placeholder="yourname@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">密码</label>
<div class="relative">
<input class="w-full px-4 py-3 rounded-lg border border-graphite-border bg-mist-surface text-on-surface font-body-md focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/15 transition-all pr-12" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none flex items-center justify-center p-1" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Validation hint -->
<p class="mt-2 font-caption text-caption text-fog-gray-text">密码至少 6 位</p>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between mt-4">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-graphite-border text-primary-container focus:ring-primary-container/15 cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
              记住我
            </label>
</div>
<a class="font-body-md text-body-md text-primary-container hover:text-primary-container/80 transition-colors" href="#">
            忘记密码？
          </a>
</div>
<!-- Login Button -->
<button class="w-full bg-primary-container text-white py-3 px-4 rounded-lg font-title-md text-title-md hover:bg-primary-container/90 focus:outline-none focus:ring-2 focus:ring-primary-container/15 focus:ring-offset-2 transition-all mt-6 shadow-sm" type="submit">
          登 录
        </button>
</form>
<!-- Footnote -->
<div class="mt-8 text-center">
<p class="font-caption text-caption text-fog-gray-text">
          仅限公司内部员工使用 · 问题求助联系 IT 服务台
        </p>
</div>
</div>
</div>
