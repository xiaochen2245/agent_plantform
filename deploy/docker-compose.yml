# Agent Platform — container orchestration
# Usage: docker compose -f deploy/docker-compose.yml up -d
# Env:    copy deploy/.env.example to deploy/.env first
#
# NOTE (s3 slice): backend/Dockerfile and frontend/Dockerfile are owned by
# slices s1/s2. Build contexts reference them by path; see deploy/BUILD_NOTES.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ap-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_platform}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_dev_only}
    # No host port: backend reaches postgres via the compose network.
    # Avoids clashing with Dify's own Postgres on the server.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: agent-platform-backend:latest  # 与 prebuilt compose 同名，服务器侧构建/本机构建产物互通
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${GIT_SHA:-dev}
    container_name: ap-backend
    env_file:
      - path: .env
        required: false   # fresh checkout can still `docker compose config` before cp .env.example .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent_dev_only}@postgres:5432/${POSTGRES_DB:-agent_platform}
    expose:
      - "8000"
    volumes:
      # 上传附件持久化：UPLOAD_DIR 缺省 uploads（相对 /app）→ 命名卷，重部署不丢
      - ap_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: agent-platform-frontend:latest  # 同上
    # Multi-stage image owned by slice s2: node:20 build -> nginx:1.25-alpine + dist.
    # Routing config stays in this slice: bind-mounted over the stock conf.d entry.
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        BUILD_SHA: ${GIT_SHA:-dev}
    container_name: ap-frontend
    # Coexist with Dify on the same host: Dify keeps :80/:3000, our portal
    # listens on PORTAL_PORT (default 8080). Set via deploy/.env
    ports:
      - "${PORTAL_PORT:-8080}:80"
    volumes:
      - ./nginx/conf.d/portal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  # 上传附件（backend UPLOAD_DIR=/app/uploads）
  ap_uploads:
